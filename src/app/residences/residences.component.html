  <h2 style="text-align: center; padding: 2%;">Liste Residences</h2>

<br><br>

<div class="container">

 <div class="row">

  <div class="col-md-4"style="margin-bottom: 20px" *ngFor="let r of listResidences">

   <div class="card" style="width: 18rem">

    <img class="card-img-top" [src]="r.image" alt="no" />

    <div class="card-body">

     <h5 class="card-title">{{r.name}}</h5>

     <button (click)="showLocation(r)">Show Location</button>
     <button (click)="addToFavorites(r)">Like</button>

     <p>Status: 
      <span *ngIf="r.status === 'Disponible'">🟢 Disponible</span>
      <span *ngIf="r.status === 'En Construction'">🟡 En Construction</span>
      <span *ngIf="r.status === 'Vendu'">🔴 Vendu</span>
    </p>

    </div>
    <h2>Favoris</h2>
    <ul>
      <li *ngFor="let fav of favorites">{{ fav.name }}</li>
    </ul>
   </div>


   <h2>Residences</h2>
   <div *ngFor="let residence of listResidences">
     <h3>{{ residence.name }}</h3>
     <p>{{ residence.status }}</p>
     <button [routerLink]="['/residence-details', residence.id]">Details</button>
     <button [routerLink]="['/apartments-by-residence', residence.id]">Appartements List</button>
   </div>   




  </div>

 </div>

</div>
