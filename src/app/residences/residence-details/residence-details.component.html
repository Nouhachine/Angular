<h2>{{ residence.name }}</h2>
<p>{{ residence.address }}</p>
<img [src]="residence.image" alt="{{ residence.name }}">
<p>{{ residence.status }}</p>
<button (click)="showNextResidence()">Next</button>
<button [routerLink]="['/add-residence']">Add Residence</button>
<button [routerLink]="['/add-residence', residence.id]">Update Residence</button>
